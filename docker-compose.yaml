services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend       # Казва на Docker да влезе в папка frontend
      dockerfile: Dockerfile    # И да изпълни Dockerfile, който е вътре
    ports:
      - "5173:5173"             # Свързва портовете (локален:контейнер)
    volumes:
      # Синхронизира локалната папка frontend с папката /app в контейнера
      - ./frontend/:/app/
      # Предотвратява презаписването на node_modules вътре в контейнера
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true  # Гарантира, че Vite ще улови промените по кода
      - VITE_API_BASE_URL=http://localhost:9000
