spring:
  config:
    activate:
      on-profile: dev
    # Treat the extensionless dotenv file as Java properties.
    import: optional:file:.env[.properties]
  jpa:
    show-sql: true

logging:
  level:
    com.mse.edu.forum: DEBUG

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
